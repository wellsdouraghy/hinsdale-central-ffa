<!doctype html>
<html lang="en">
<head>

  <base href="../" />
  <title>World dev viewer</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:12px/1.3 ui-monospace,monospace}

  <div id="hud"></div><div id="attr"></div><div id="load">loading…</div>
